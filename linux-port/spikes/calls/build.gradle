plugins { id 'application' }
repositories { mavenCentral() }
java { sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21 }
dependencies {
    implementation('dev.onvoid.webrtc:webrtc-java:0.20.0') { transitive = false }
    runtimeOnly('dev.onvoid.webrtc:webrtc-java:0.20.0:linux-x86_64') { transitive = false }
}
application { mainClass = 'relay.spike.CallsProbe' }
tasks.withType(JavaExec).configureEach {
    systemProperty 'java.io.tmpdir', System.getenv('TMPDIR') ?: System.getProperty('java.io.tmpdir')
}
tasks.register('probe', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = application.mainClass
}
tasks.register('relayProbe', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = application.mainClass
    args '--turn'
}
